{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_expense.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container edit-expense-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update this transaction</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', expense_id=expense_id) }}">

                <div class="form-group">
                    <label for="amount">Amount (&#8377;)</label>
                    <input type="number"
                           id="amount"
                           name="amount"
                           class="form-input"
                           placeholder="0.00"
                           step="0.01"
                           min="0.01"
                           value="{{ form.amount or '' }}"
                           required
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input form-select" required>
                        <option value="" disabled {% if not form.category %}selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if form.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date"
                           id="date"
                           name="date"
                           class="form-input"
                           value="{{ form.date or '' }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="edit-expense-optional">(optional)</span></label>
                    <textarea id="description"
                              name="description"
                              class="form-input edit-expense-textarea"
                              placeholder="e.g. Lunch at the deli"
                              rows="3">{{ form.description or '' }}</textarea>
                </div>

                <button type="submit" class="btn-submit">Save Changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">&#8592; Back to profile</a>
        </p>

    </div>
</section>
{% endblock %}
